name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cooking_blog
          POSTGRES_USER: cooking_blog
          POSTGRES_PASSWORD: cooking_blog_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cooking_blog -d cooking_blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt scalafmtCheckAll
      - name: Compile and test
        run: sbt test
