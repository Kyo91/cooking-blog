services:
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio-root
      MINIO_ROOT_PASSWORD: minio-root-development-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - cooking_blog_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-bucket-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minio-root
      MINIO_ROOT_PASSWORD: minio-root-development-only
      PHOTO_S3_ACCESS_KEY_ID: cooking-blog
      PHOTO_S3_SECRET_ACCESS_KEY: cooking-blog-dev-secret
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing local/cooking-blog-photos;
        mc admin user add local "$$PHOTO_S3_ACCESS_KEY_ID" "$$PHOTO_S3_SECRET_ACCESS_KEY" || true;
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::cooking-blog-photos"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::cooking-blog-photos/cooking-blog/photos/*"]}]}' > /tmp/cooking-blog-photo-policy.json;
        mc admin policy create local cooking-blog-photo-store /tmp/cooking-blog-photo-policy.json || true;
        mc admin policy attach local cooking-blog-photo-store --user "$$PHOTO_S3_ACCESS_KEY_ID"
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cooking_blog
      POSTGRES_USER: cooking_blog
      POSTGRES_PASSWORD: cooking_blog_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cooking_blog -d cooking_blog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - cooking_blog_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  cooking_blog_minio_data:
  cooking_blog_postgres_data:
